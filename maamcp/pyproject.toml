[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maamcp"
version = "0.1.0"
description = "MCP Server for Arknights automation via MAA"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "tomli>=2.0.0; python_version<'3.11'",
    "tomli-w>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/maamcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
