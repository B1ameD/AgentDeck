# SwiftLint configuration for AgentDeck
# Thresholds are tuned so the existing codebase passes; tighten them as files get refactored.

included:
  - Sources
  - Tests

excluded:
  - .build
  - dist
  - Scripts

disabled_rules:
  - line_length            # 长中文注释/字符串较多，暂不限制
  - todo
  - trailing_whitespace

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_filter_is_empty
  - redundant_nil_coalescing

file_length:
  warning: 1500
  error: 2000

type_body_length:
  warning: 1200
  error: 1600

function_body_length:
  warning: 150
  error: 300

cyclomatic_complexity:
  warning: 25
  error: 40

identifier_name:
  min_length: 1
  max_length: 60

nesting:
  type_level: 3

large_tuple:
  warning: 4
  error: 5
